# Saath — local dev compose. Day 1 only provisions db + redis so the
# smoke test can run. App/bot/workers are added as we build them.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saath
      POSTGRES_PASSWORD: saath
      POSTGRES_DB: saath
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saath -d saath"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - rdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  freeswitch:
    build: ./freeswitch          # custom image: fixes IPv6 ESL binding + injects ESL_PASSWORD
    ports:
      - "8021:8021"              # ESL — Python app connects here
      - "5060:5060/udp"          # SIP signalling
      - "5060:5060/tcp"
      - "16384-16484:16384-16484/udp"  # RTP media ports
    volumes:
      - ./freeswitch/conf/sip_profiles/external/saath-gw.xml:/etc/freeswitch/sip_profiles/external/saath-gw.xml:ro
    environment:
      ESL_PASSWORD: ${FS_ESL_PASSWORD:-change-me-esl}
    healthcheck:
      test: ["CMD-SHELL", "fs_cli -p ${FS_ESL_PASSWORD:-change-me-esl} -x 'status' | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  pgdata:
  rdata:
