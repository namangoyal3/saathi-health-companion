name: Android APK

on:
  push:
    branches: [main, 'day3/**', 'fix/**', 'feature/**']
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/saath-companion

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then
            echo "Generating Gradle wrapper"
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          fi

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK with commit sha
        run: |
          mkdir -p ../../artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
             "../../artifacts/saath-companion-${GITHUB_SHA::7}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: saath-companion-debug-apk
          path: artifacts/*.apk
          retention-days: 30
          if-no-files-found: error
