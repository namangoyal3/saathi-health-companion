name: Android APK

on:
  push:
    branches: [main, 'day3/**', 'fix/**', 'feature/**']
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    # `contents: write` is needed for the Release-creation step below.
    # Everything else stays read-only.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android/saath-companion

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then
            echo "Generating Gradle wrapper"
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          fi

      - name: Run JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload unit-test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 7

      - name: Rename APK with commit sha
        run: |
          mkdir -p ../../artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
             "../../artifacts/saath-companion-${GITHUB_SHA::7}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: saath-companion-debug-apk
          path: artifacts/*.apk
          retention-days: 30
          if-no-files-found: error

      # Publish the APK as a GitHub Release so there's a stable, tappable
      # download URL (artifacts require GitHub login; releases don't).
      # Runs on push to long-lived branches only — not on PRs or feature
      # branches, to keep the release list tidy.
      - name: Publish Release with APK
        if: >-
          github.event_name == 'push'
          && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/day3/'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        working-directory: ${{ github.workspace }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="apk-${SHORT_SHA}"
          BRANCH="${GITHUB_REF#refs/heads/}"
          BRANCH_SLUG="${BRANCH//\//-}"
          APK="artifacts/saath-companion-${SHORT_SHA}.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — replacing asset."
            gh release upload "$TAG" "$APK" --clobber
          else
            cat > /tmp/release_notes.md <<MD
          Debug APK built from commit [\`$SHORT_SHA\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) on branch \`$BRANCH\`.

          **Direct download:** \`saath-companion-${SHORT_SHA}.apk\` (below)

          Triggered by: \`${GITHUB_EVENT_NAME}\`
          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          ## Install on Galaxy

          1. Tap the APK link above (no GitHub login needed).
          2. Allow "install from this source" when Android prompts.
          3. Open Saath → enter Senior ID + Shared Secret + Backend URL → grant Health Connect permissions.
          4. First sync runs on Finish. With HC permissions it posts real watch data; without, it posts a mock \`dizziness_episode\` payload so you can verify the backend pipeline.
          MD
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "APK — $BRANCH_SLUG @ $SHORT_SHA" \
              --prerelease \
              --notes-file /tmp/release_notes.md \
              "$APK"
          fi

          RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          DOWNLOAD_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/saath-companion-${SHORT_SHA}.apk"
          echo ""
          echo "::notice title=APK published::$DOWNLOAD_URL"
          {
            echo "## 📱 APK published"
            echo ""
            echo "**Download:** $DOWNLOAD_URL"
            echo ""
            echo "**Release page:** $RELEASE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
