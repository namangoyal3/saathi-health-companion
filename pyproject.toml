[project]
name = "saath"
version = "0.1.0"
description = "Saath — AI health companion for aging Indian parents and their NRI children."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Naman Goyal" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "redis>=5.1",
    "arq>=0.26",
    "anthropic>=0.45",
    "httpx>=0.27",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "python-telegram-bot>=21.6",
    "apscheduler>=3.10",
    "pytz>=2024.1",
    "python-dateutil>=2.9",
    "pymupdf>=1.27.2.2",
    "pdfplumber>=0.11.9",
    "boto3>=1.42.94",
    "langfuse>=4.5.0",
    "python-multipart>=0.0.26",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-python-dateutil>=2.9",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "C4",  # comprehensions
    "SIM", # simplify
    "T20", # print (we use structlog; no print in app code)
    "RUF",
]
ignore = [
    "E501",  # line length handled by ruff format
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"scripts/**" = ["T20"]
"evals/**" = ["T20"]
"app/bot/strings.py" = ["RUF001"]  # intentional Unicode emoji in UI strings

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["migrations/", "build/", "dist/", ".venv/"]

[[tool.mypy.overrides]]
module = ["tests.*", "evals.*", "scripts.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# PTB generic types (Application[BT,CCT,UD,CD,BD,JQ]) + APScheduler make strict mypy
# impractical for the bot integration layer. Errors are suppressed here.
module = ["app.bot.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-markers"]
