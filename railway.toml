[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway healthcheck hits /health — our endpoint asserts DB connectivity
# via SELECT 1, so a green check means Postgres is wired too.
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
